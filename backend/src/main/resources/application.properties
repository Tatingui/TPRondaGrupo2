# Servidor
server.port=8081
server.servlet.context-path=/api

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ronda?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ronda
spring.datasource.password=ronda
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Datos semilla (data.sql)
# defer-datasource-initialization=true es OBLIGATORIO: sin esto Spring ejecuta
# data.sql ANTES de que Hibernate cree las tablas, y falla con "table doesn't exist".
# sql.init.mode=always tambien hace falta: por defecto data.sql solo corre en bases
# embebidas (H2), no en MySQL.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
# Placeholder de desarrollo. En produccion iria por variable de entorno:
#   jwt.secret=${JWT_SECRET:...}
jwt.secret=RondaTPO2026SecretKeyParaDesarrolloLocalNoUsarEnProduccion1234567890
jwt.expiration-ms=86400000

# Logging
logging.level.com.ronda.backend=DEBUG
