plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
}

// Lee BASE_URL de local.properties (cada dev configura la suya)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}


android {
    namespace 'com.example.tprondagrupo2'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.tprondagrupo2"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // URL del backend inyectada desde local.properties
        buildConfigField "String", "BASE_URL", "\"${localProps.getProperty('BASE_URL', 'http://10.0.2.2:8081/api/')}\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // Navigation Component
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // ViewPager2 para la galeria de fotos
    implementation libs.viewpager2

    // Retrofit + Gson
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    // OkHttp + Logging
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor

    // Glide para imagenes
    implementation libs.glide

    // Room
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // DataStore + RxJava3
    implementation libs.datastore.preferences
    implementation libs.datastore.preferences.rxjava3
    implementation libs.rxjava3
    implementation libs.rxandroid

    // Hilt
    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    // Biometric + Security Crypto
    implementation libs.biometric
    implementation libs.security.crypto
}